name: Test Trendyol and N11 Isolated Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/test_trendyol_n11.py'
      - '.github/workflows/test_ty_n11.yml'

jobs:
  test-trendyol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi urllib3
      - name: Test Trendyol
        run: |
          python -c "from backend.test_trendyol_n11 import test_trendyol; c = test_trendyol('kahve makinesi'); assert c >= 10"

  test-n11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi urllib3
      - name: Test N11
        run: |
          python -c "from backend.test_trendyol_n11 import test_n11; c = test_n11('kahve makinesi'); assert c >= 10"
