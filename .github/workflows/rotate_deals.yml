name: Rotate Deals Engine

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi urllib3 beautifulsoup4

      - name: Run Rotation Engine (4h rotation + 48h master pool refresh)
        run: |
          python backend/rotation_engine.py

      - name: Commit and push updated rotation state and pools
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/rotation_state.json backend/pool/*.json assets/data/live_deals.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-rotate catalog" && git push)
